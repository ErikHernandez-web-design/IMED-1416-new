<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>05-Styling-Lists</title>
    <link rel="stylesheet" type="text/css" href="./includes/css/stylesheet.css">
    <script src="./includes/javascript/javascript.js"></script>
<style>
ul.c1 {list-style-type: circle;}
ul.c2 {list-style-type: disc;}
ul.c3 {list-style-type: lower-greek;}
ol.c4 {list-style-type: lower-roman;}
ol.c5 {list-style-type: upper-latin;}
</style>

</head>

<body>
<header></header>
<nav> <!-- Navigation Section -->
<ul>
    <li><a href="./">Chapter 03 Homepage </a></li>
</ul>
</nav>

<section> <!-- main body portion od site -->

 <div class="lists-split">  
    <div class="lists-split-left">
        <p><b>Unordered Lists</b></p>
        <ul class="c1">
            <li>Dog</li>
            <li>Cat</li>
            <li>Bird</li>
        </ul>

        <ul class="c2">
            <li>Car 1</li>
            <li>Bike 2</li>
            <li>Truck 3</li>
        </ul>

        <ul class="c3">
            <li>Shoe</li>
            <li>Sock 2</li>
            <li>Sandal 3</li>
        </ul>
    </div>

    <div class="lists-split-right">
        <p><b>Ordered Lists</b></p>
        <ol class="c4">
            <li>Rock</li>
            <li>Sand 2</li>
            <li>Earth 3</li>
        </ol>

        <ol class="c5">
            <li>Phone 1</li>
            <li>Water 2</li>
            <li>Fire 3</li>
        </ol>
    </div>  
 </div>   
</section>



<footer>
	<nav> <!-- THis is the stie map -->
		<ul>
    <li><a href="./">Chapter 03 Homepage</a></li>
    
		</ul>
	</nav>
</footer>
</html>
